[project]
name = "clickbait-detector"
version = "0.1.0"
description = "Vietnamese clickbait detection via fine-tuned small LMs"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.44.0",
    "datasets>=3.0.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0",
    "trl>=0.12.0",
    "accelerate>=1.0.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "ipykernel>=6.29",
]
logging = [
    "tensorboard>=2.18",
    "wandb>=0.18",
]

[project.scripts]
train = "scripts.train:main"
test = "scripts.test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
